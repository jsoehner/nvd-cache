name: NVD Cache Update

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-nvd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Restore Previous NVD Cache Release
        run: |
          mkdir -p ~/.m2/repository/org/owasp/dependency-check-data/11.0
          if curl -fsSL -o /tmp/odc.mv.db.zip https://github.com/jsoehner/nvd-cache/releases/download/latest-nvd-data/odc.mv.db.zip; then
            unzip -q -o /tmp/odc.mv.db.zip -d ~/.m2/repository/org/owasp/dependency-check-data/11.0/
            rm -f /tmp/odc.mv.db.zip
          fi

      - name: Update NVD Database
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          # Use the latest major version (13.0.0) of dependency-check-maven directly
          if [ -z "$NVD_API_KEY" ]; then
            echo "NVD_API_KEY not found. Retaining existing pre-cached database if available..."
            mvn org.owasp:dependency-check-maven:13.0.0:update-only -DassemblyAnalyzerEnabled=false -DossindexAnalyzerEnabled=false || true
          else
            echo "Updating NVD database using API key..."
            mvn org.owasp:dependency-check-maven:13.0.0:update-only -DnvdApiKey=$NVD_API_KEY -DassemblyAnalyzerEnabled=false -DossindexAnalyzerEnabled=false
          fi

      - name: Compress H2 Database
        run: |
          # Find the H2 database file (e.g., in a version-specific subdirectory like 11.0/)
          DB_FILE=$(find ~/.m2/repository/org/owasp/dependency-check-data -name "odc.mv.db" | head -n 1)
          if [ -z "$DB_FILE" ]; then
            echo "Error: odc.mv.db not found!"
            exit 1
          fi
          DB_DIR=$(dirname "$DB_FILE")
          echo "Found database directory at: $DB_DIR"
          zip -j ~/.m2/repository/org/owasp/dependency-check-data/odc.mv.db.zip \
            "$DB_DIR"/odc.mv.db \
            "$DB_DIR"/publishedSuppressions.xml* \
            "$DB_DIR"/jsrepository.json* || zip -j ~/.m2/repository/org/owasp/dependency-check-data/odc.mv.db.zip "$DB_FILE"

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete the existing release and tag if it exists to replace it
          gh release delete latest-nvd-data -y --cleanup-tag || true
          
          # Create a new release and upload the compressed database
          gh release create latest-nvd-data ~/.m2/repository/org/owasp/dependency-check-data/odc.mv.db.zip \
            --title "NVD Database Cache" \
            --notes "Automated NVD database update for security scanning jobs." \
            --latest
